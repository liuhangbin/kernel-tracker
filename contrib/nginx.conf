# nginx configuration for the kernel-tracker container.
#
# Gunicorn listens on 127.0.0.1:8000, started by contrib/start. nginx
# terminates HTTP on port 80 and serves the collected static files
# directly. Logs live under /data/log so that `make log` can
# read them.

user www-data;
worker_processes auto;
error_log /data/log/error.log warn;
pid /data/log/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /data/log/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    # /var/lib/nginx is not writable by the nginx user in the container.
    client_body_temp_path /data/tmp/client_body;
    proxy_temp_path /data/tmp/proxy;
    fastcgi_temp_path /data/tmp/fastcgi;
    uwsgi_temp_path /data/tmp/uwsgi;
    scgi_temp_path /data/tmp/scgi;

    upstream kernel_tracker {
        server 127.0.0.1:8000;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /static/ {
            alias /data/static/;
            expires 30d;
        }

        location / {
            proxy_pass http://kernel_tracker;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
