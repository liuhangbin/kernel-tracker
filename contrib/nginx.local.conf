# nginx configuration for running kernel-tracker on a development machine.
#
# Start gunicorn first, then run nginx with this file:
#
#   gunicorn kernel_tracker.wsgi:application --bind 127.0.0.1:8000
#   nginx -c "$PWD/contrib/nginx.local.conf" -p "$PWD"
#
# The -p prefix makes the relative log/ and temp/ paths below resolve
# inside the checkout. With DEBUG enabled Django serves /static/ itself,
# so everything is proxied to gunicorn.

worker_processes 1;
error_log logs/error.log;
pid logs/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log logs/access.log;
    client_max_body_size 10m;

    client_body_temp_path tmp/client_body;
    proxy_temp_path tmp/proxy;

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
